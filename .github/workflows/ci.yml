name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Runs first, and on its own: if something private reached this repository
      # the build result does not matter, and every later step only adds noise
      # between the failure and the person reading the log.
      - name: Purity
        run: pnpm purity

      - run: pnpm build
      - run: pnpm typecheck

      # Copying is a supported way to consume this, so it has to keep working: eject
      # into a real app and typecheck there. A rewritten import that points nowhere
      # would otherwise only show up in someone else's repository.
      - name: Copy check
        run: |
          node packages/cli/dist/main.js add surface button a11y --dest apps/example/src/_copycheck
          pnpm --filter example typecheck
          rm -rf apps/example/src/_copycheck

      # The catalog's stories run as tests in a real browser, so the browser has
      # to be there before the test step rather than as part of it.
      - name: Install browser
        run: pnpm --filter catalog exec playwright install --with-deps chromium

      - run: pnpm test

      # The static catalog is a deliverable of its own — the page other people are
      # sent to look at. Building it here keeps that page from rotting unnoticed.
      - name: Build catalog
        run: pnpm --filter catalog build

      # What a consumer actually receives: the file list, the exports map, and
      # whether types resolve. These break silently — nothing in the repository
      # fails when a published entry point points at a file that was never built.
      - name: Packaging
        run: pnpm check:packaging
